<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testimonial Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__left">
      <h1>Testimonial Dashboard</h1>
      <nav id="nav" class="nav"></nav>
    </div>
    <div class="topbar__right">
      <span class="actorlabel">Acting as</span>
      <span id="actorSlot"></span>
      <span id="status" class="status">Starting…</span>
      <button id="reload" class="btn btn--sm">Reload</button>
    </div>
  </header>

  <div id="proxyWarn" class="proxywarn" hidden></div>
  <div id="simWarn" class="simwarn" hidden></div>

  <main id="app"></main>

  <footer class="footer">
    Event log is the memory · stage is computed, never stored · every write is attributed ·
    <code id="pagesUrl"></code>
  </footer>

  <!-- Load order matters: each module reads the ones above it. -->
  <script src="dashboard/clock.js"></script>
  <script src="dashboard/config.js"></script>
  <script src="dashboard/dialog.js"></script>
  <script src="dashboard/sheets-reader.js"></script>
  <script src="dashboard/identity.js"></script>
  <script src="dashboard/state-builder.js"></script>
  <script src="dashboard/event-writer.js"></script>
  <script src="dashboard/pipeline-board.js"></script>
  <script src="dashboard/client-card.js"></script>
  <script src="dashboard/calendar.js"></script>
  <script src="dashboard/calendar-view.js"></script>
  <script src="dashboard/flows.js"></script>
  <script src="dashboard/alerts.js"></script>
  <script src="dashboard/queue-view.js"></script>
  <script src="dashboard/renderer.js"></script>
  <script src="app.js"></script>

</body>
</html>
